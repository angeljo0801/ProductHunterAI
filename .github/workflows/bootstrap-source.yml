name: Complete source import

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/producthunter/ai
          cat .bootstrap/live/part-* | base64 --decode > app/src/main/java/com/producthunter/ai/LiveResearchClient.kt
          cat .bootstrap/main/part-* | base64 --decode > app/src/main/java/com/producthunter/ai/MainActivity.kt
          test -s app/src/main/java/com/producthunter/ai/LiveResearchClient.kt
          test -s app/src/main/java/com/producthunter/ai/MainActivity.kt
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Complete Product Hunter AI v0.2 source"
          git push
